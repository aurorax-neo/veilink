[package]
name = "veilink"
version = "0.4.19"
edition = "2021"
build = "build.rs"

[[bin]]
name = "veilink"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
ctr = "0.9"
aes = "0.8"
aes-gcm = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
fips204 = "0.4"
futures = "0.3"
futures-util = "0.3"
h2 = "0.4"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "http2", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["full"] }
ml-kem = { version = "0.3", features = ["getrandom"] }
p256 = { version = "0.13", features = ["ecdh"] }
parking_lot = "0.12"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.9"
rcgen = "0.13"
regex = "1"
rusqlite = { version = "0.33", features = ["bundled"] }
rust-embed = "8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webpki-roots = "1"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
yamux = "0.14"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
opt-level = 3

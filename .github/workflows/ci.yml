name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Go package tests
        working-directory: backend
        run: |
          failed=0
          while IFS= read -r pkg; do
            echo "::group::go test ${pkg}"
            log_file="$(mktemp)"
            if go test -count=1 "$pkg" -timeout=5m >"$log_file" 2>&1; then
              cat "$log_file"
            else
              cat "$log_file"
              details="$(tail -n 12 "$log_file" | tr '\r\n' ' ' | cut -c1-1000)"
              echo "::error title=Go package test failed::${pkg}: ${details}"
              failed=1
            fi
            echo "::endgroup::"
          done < <(go list ./... | grep -v '^veilink/internal/tunnel$')
          exit "$failed"
      - name: Tunnel regression tests
        working-directory: backend
        run: |
          go test ./internal/tunnel \
            -skip '^(TestProtocolMatrixRoundTrip|TestXHTTPCombinationMatrix)$' \
            -count=1 -timeout=5m
      - name: Protocol matrix
        working-directory: backend
        run: go test ./internal/tunnel -run '^TestProtocolMatrixRoundTrip$' -count=1 -timeout=5m
      - name: XHTTP matrix
        working-directory: backend
        run: go test ./internal/tunnel -run '^TestXHTTPCombinationMatrix$' -count=1 -timeout=5m
      - name: Go vet
        working-directory: backend
        run: |
          go vet ./...
      - name: Go race checks
        working-directory: backend
        run: |
          go test -race ./internal/store ./internal/config ./internal/cli
      - name: Integration tests
        working-directory: backend
        run: |
          go test -tags integration ./tests/integration -count=1
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          node --test tests/*.mjs
          npm run typecheck
          npm run build

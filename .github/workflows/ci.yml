name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Go checks
        working-directory: backend
        run: |
          go test ./... -timeout=15m
          go vet ./...
          # Keep race coverage on deterministic stateful packages. The tunnel
          # package has long-running network/protocol matrices that are covered
          # by the regular suite but exceed hosted-runner race time budgets.
          go test -race ./internal/store ./internal/config ./internal/cli
          go test -tags integration ./tests/integration -count=1
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          node --test tests/*.mjs
          npm run typecheck
          npm run build

name: Release Backend

on:
  push:
    tags:
      - 'v*'
      - '!web-v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Build
        working-directory: backend
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          EXT=""
          [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w -X veilink/internal/buildinfo.Version=${VERSION} -X veilink/internal/buildinfo.Commit=${GITHUB_SHA::8}" \
            -o ../veilink-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} ./cmd/veilink
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: veilink-${{ matrix.goos }}-${{ matrix.goarch }}
          path: veilink-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          title: "${{ github.ref_name }}"
          files: dist/veilink-*
          generate_release_notes: true
  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push unified image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: unified
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

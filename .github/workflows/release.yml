name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布版本号，例如 v0.4.13"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    name: Build Frontend UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  build-binaries:
    name: Build Binary (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: build-frontend
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            rust_target: x86_64-apple-darwin
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
          - goos: windows
            goarch: amd64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install musl tools on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Build and package native binary
        shell: bash
        working-directory: backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RUST_TARGET: ${{ matrix.rust_target }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ -z "$tag" || "$tag" == "main" || "$tag" == "master" ]]; then
            tag="dev-${GITHUB_RUN_ID}"
          fi
          suffix=""
          if [[ "$GOOS" == "windows" ]]; then
            suffix=".exe"
          fi
          if [[ "$RUST_TARGET" == "aarch64-unknown-linux-musl" ]] && ! command -v aarch64-linux-musl-gcc >/dev/null 2>&1; then
            export CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc
            export AR_aarch64_unknown_linux_musl=aarch64-linux-gnu-ar
            export CFLAGS_aarch64_unknown_linux_musl="-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -DSQLITE_DISABLE_LFS"
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
          fi
          rm -rf ../release-pkg ../release-packages
          mkdir -p ../release-pkg ../release-packages
          rm -rf internal/webui/dist
          mkdir -p internal/webui/dist
          cp -R ../frontend/dist/. internal/webui/dist/
          test -s internal/webui/dist/index.html
          export VEILINK_VERSION="${tag}"
          export VEILINK_COMMIT="${GITHUB_SHA}"
          cargo build --release --locked --target "${RUST_TARGET}"
          cp "target/${RUST_TARGET}/release/veilink${suffix}" "../release-pkg/veilink${suffix}"
          cp ../LICENSE ../NOTICE ../THIRD_PARTY_NOTICES.md ../README.md ../release-pkg/
          printf '%s\n' \
            "Source: https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}" \
            "Version: ${tag}" \
            "Unified executable: master|server|client subcommands." \
            "Management Web assets are embedded in the veilink binary." > ../release-pkg/BUILD.txt
          tar -czf "../release-packages/veilink-${GOOS}-${GOARCH}.tar.gz" -C ../release-pkg .
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-packages/
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release Assets
    needs: build-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' 不符合 SemVer，应为 vX.Y.Z 或 vX.Y.Z-pre"
            exit 1
          fi
          version="${tag#v}"
          source_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$source_version" != "$version" ]]; then
            echo "::error::VERSION=$source_version 与 Tag=$version 不一致"
            exit 1
          fi
          version_ere="${version//./\\.}"
          header_count="$(grep -cE "^## \\[$version_ere\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || true)"
          if [[ "$header_count" != "1" ]]; then
            echo "::error::CHANGELOG.md 缺少唯一的 $version 版本段落"
            exit 1
          fi
          body="$(awk -v ver="$version" '
            $0 == "## [" ver "]" || index($0, "## [" ver "] - ") == 1 {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md)"
          if ! printf '%s\n' "$body" | grep -q '[^[:space:]]'; then
            echo "::error::CHANGELOG.md 中版本 $version 内容为空"
            exit 1
          fi
          if ! printf '%s\n' "$body" | grep -q '^### '; then
            echo "::error::CHANGELOG.md 中版本 $version 缺少分类标题"
            exit 1
          fi
          printf '%s\n' "$body" > release-body.md
          stable=true
          [[ "$tag" == *-* ]] && stable=false
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
      - name: Verify release body
        run: |
          set -euo pipefail
          test -s release-body.md
          sed -n '1,160p' release-body.md
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: downloaded-artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp downloaded-artifacts/* release-assets/
          (cd release-assets && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body_path: release-body.md
          files: release-assets/*
          generate_release_notes: false
          prerelease: ${{ steps.release.outputs.stable != 'true' }}

  docker:
    name: Publish Multi-arch Docker Image to GHCR
    needs: build-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download Linux amd64 package
        uses: actions/download-artifact@v4
        with:
          name: package-linux-amd64
          path: pkg-amd64
      - name: Download Linux arm64 package
        uses: actions/download-artifact@v4
        with:
          name: package-linux-arm64
          path: pkg-arm64
      - name: Prepare Docker inputs
        run: |
          set -euo pipefail
          mkdir -p docker-bin/amd64 docker-bin/arm64
          mkdir -p unpack-amd64 unpack-arm64
          tar -xzf pkg-amd64/*.tar.gz -C unpack-amd64
          tar -xzf pkg-arm64/*.tar.gz -C unpack-arm64
          install -m 0755 unpack-amd64/veilink docker-bin/amd64/veilink
          install -m 0755 unpack-arm64/veilink docker-bin/arm64/veilink
          test -s docker-bin/amd64/veilink
          test -s docker-bin/arm64/veilink
      - name: Set up QEMU for target image assembly
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tags
        id: image
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' 不符合 SemVer"
            exit 1
          fi
          version="${tag#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="${image}:${version},${image}:${tag}"
          if [[ "$tag" != *-* ]]; then
            tags="${tags},${image}:latest"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push multi-arch image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            COMMIT=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image digest
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.image.outputs.version }}
          DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          {
            echo "### Multi-arch image published"
            echo "- Image: \`${IMAGE}:${VERSION}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"

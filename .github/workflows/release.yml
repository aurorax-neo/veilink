name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布版本号，例如 v0.4.12；留空生成开发版标签"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    name: Build Frontend UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  build-binaries:
    name: Build Binary (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: build-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Build and package native binary
        working-directory: backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ -z "$tag" || "$tag" == "main" || "$tag" == "master" ]]; then
            tag="dev-${GITHUB_RUN_ID}"
          fi
          suffix=""
          if [[ "$GOOS" == "windows" ]]; then
            suffix=".exe"
          fi
          rm -rf ../release-pkg ../release-packages
          mkdir -p ../release-pkg/html ../release-packages
          go build -trimpath \
            -ldflags="-s -w -X veilink/internal/buildinfo.Version=${tag} -X veilink/internal/buildinfo.Commit=${GITHUB_SHA}" \
            -o "../release-pkg/veilink${suffix}" ./cmd/veilink
          cp -R ../frontend/dist/. ../release-pkg/html/
          cp ../LICENSE ../NOTICE ../THIRD_PARTY_NOTICES.md ../README.md ../release-pkg/
          printf '%s\n' \
            "Source: https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}" \
            "Version: ${tag}" \
            "Unified executable: master|server|client subcommands." \
            "Management Web assets are in html/." > ../release-pkg/BUILD.txt
          tar -czf "../release-packages/veilink-${GOOS}-${GOARCH}.tar.gz" -C ../release-pkg .
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-packages/
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release Assets
    needs: build-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ -z "$tag" || "$tag" == "main" || "$tag" == "master" ]]; then
            tag="dev-${GITHUB_RUN_ID}"
          fi
          stable=false
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            stable=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: downloaded-artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp downloaded-artifacts/* release-assets/
          (cd release-assets && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.stable != 'true' }}

  docker:
    name: Publish Multi-arch Docker Image to GHCR
    needs: build-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download Linux amd64 package
        uses: actions/download-artifact@v4
        with:
          name: package-linux-amd64
          path: pkg-amd64
      - name: Download Linux arm64 package
        uses: actions/download-artifact@v4
        with:
          name: package-linux-arm64
          path: pkg-arm64
      - name: Prepare Docker inputs
        run: |
          set -euo pipefail
          mkdir -p docker-bin/amd64 docker-bin/arm64 docker-web
          mkdir -p unpack-amd64 unpack-arm64
          tar -xzf pkg-amd64/*.tar.gz -C unpack-amd64
          tar -xzf pkg-arm64/*.tar.gz -C unpack-arm64
          install -m 0755 unpack-amd64/veilink docker-bin/amd64/veilink
          install -m 0755 unpack-arm64/veilink docker-bin/arm64/veilink
          cp -R unpack-amd64/html/. docker-web/
          test -s docker-bin/amd64/veilink
          test -s docker-bin/arm64/veilink
          test -s docker-web/index.html
      - name: Set up QEMU for target image assembly
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tags
        id: image
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ -z "$tag" || "$tag" == "main" || "$tag" == "master" ]]; then
            tag="dev-${GITHUB_RUN_ID}"
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="${image}:${tag}"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags="${tags},${image}:latest"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ steps.image.outputs.tag }}
            COMMIT=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

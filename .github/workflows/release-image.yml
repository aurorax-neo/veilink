name: Release Unified Image

on:
  workflow_dispatch:
    inputs:
      backend_version:
        description: '后端版本 (如 v1.2.0)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.backend_version }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag or full commit
        id: rel
        env:
          REF: ${{ inputs.backend_version }}
        run: |
          ref="$REF"
          if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            git rev-parse --verify "${ref}^{commit}" >/dev/null
          elif [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]]; then
            git show-ref --verify --quiet "refs/tags/${ref}"
          else
            echo "backend_version must be an existing refs/tags/vX.Y.Z tag or 40-char commit SHA" >&2
            exit 1
          fi
          git rev-parse --verify "HEAD^{commit}" >/dev/null
          tags="ghcr.io/${GITHUB_REPOSITORY}:${ref}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push unified image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: unified
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.rel.outputs.tags }}
          build-args: |
            VERSION=${{ inputs.backend_version }}
            COMMIT=${{ steps.rel.outputs.commit }}

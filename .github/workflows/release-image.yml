name: Release Unified Image

on:
  workflow_dispatch:
    inputs:
      backend_version:
        description: '后端版本 (如 v1.2.0)'
        required: true
      web_version:
        description: '前端版本 (如 web-v1.0.0，留空用 latest)'
        required: false
        default: ''

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.backend_version }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push unified image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: unified
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.backend_version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            VERSION=${{ inputs.backend_version }}
            COMMIT=${{ github.sha }}

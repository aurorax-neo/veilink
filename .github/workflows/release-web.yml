name: Release Web

on:
  push:
    tags:
      - 'web-v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#web-v}
          tar -czf veilink-web-${VERSION}.tar.gz -C frontend/dist .
          cp veilink-web-${VERSION}.tar.gz veilink-web-${GITHUB_REF_NAME}.tar.gz
          cp veilink-web-${VERSION}.tar.gz veilink-web.tar.gz
          # 校验包内容
          tar -tzf veilink-web-${VERSION}.tar.gz | head -5
          # 生成校验文件
          sha256sum veilink-web-${VERSION}.tar.gz > veilink-web-${VERSION}.tar.gz.sha256
          sha256sum veilink-web-${GITHUB_REF_NAME}.tar.gz > veilink-web-${GITHUB_REF_NAME}.tar.gz.sha256
          sha256sum veilink-web.tar.gz > veilink-web.tar.gz.sha256
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          title: "[Web] ${{ github.ref_name }}"
          files: |
            veilink-web-*.tar.gz
            veilink-web-*.tar.gz.sha256
          generate_release_notes: true


# Development demo only: shared seven-day CA/certificate, no default admin password.
x-veilink: &veilink
  build: .
  image: veilink:local
  init: true
  restart: unless-stopped

services:
  certs:
    <<: *veilink
    profiles: [setup]
    restart: "no"
    entrypoint: /usr/local/bin/devcert
    command: [-out, /certs/demo]
    volumes: [certificates:/certs]

  init-admin:
    <<: *veilink
    profiles: [setup]
    restart: "no"
    command: [init-admin, -config, /config/master.yaml, -username, admin]
    environment:
      VEILINK_ADMIN_PASSWORD: ${VEILINK_ADMIN_PASSWORD:-}
    volumes:
      - master-data:/data
      - certificates:/certs:ro
      - ./examples/compose/master.yaml:/config/master.yaml:ro

  master:
    <<: *veilink
    command: [master, -config, /config/master.yaml]
    ports:
      - "127.0.0.1:8444:8444"
    volumes:
      - master-data:/data
      - certificates:/certs:ro
      - ./examples/compose/master.yaml:/config/master.yaml:ro

  server:
    <<: *veilink
    profiles: [nodes]
    command: [server, -config, /config/server.yaml]
    depends_on: [master]
    environment:
      VEILINK_NODE_ID: ${SERVER_NODE_ID:-}
      VEILINK_ENROLL_TOKEN: ${SERVER_ENROLL_TOKEN:-}
    ports:
      - "127.0.0.1:4433:4433"
      - "127.0.0.1:8081:8081"
    volumes:
      - server-data:/data
      - certificates:/certs:ro
      - ./examples/compose/server.yaml:/config/server.yaml:ro

  client:
    <<: *veilink
    profiles: [nodes]
    command: [client, -config, /config/client.yaml]
    depends_on: [master, server, target]
    environment:
      VEILINK_NODE_ID: ${CLIENT_NODE_ID:-}
      VEILINK_ENROLL_TOKEN: ${CLIENT_ENROLL_TOKEN:-}
    volumes:
      - client-data:/data
      - certificates:/certs:ro
      - ./examples/compose/client.yaml:/config/client.yaml:ro
    networks: [default, inside]
    # No ports: the client initiates all connections.

  target:
    image: nginx:alpine
    profiles: [nodes]
    networks: [inside]
    # Only the client can reach this internal network. No host/public port.

networks:
  inside:
    internal: true

volumes:
  certificates:
  master-data:
  server-data:
  client-data:

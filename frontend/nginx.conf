# nginx.conf — veilink-web 前端镜像配置
# 后端地址通过环境变量 BACKEND_URL 注入（构建时或运行时）

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SSE 需要关闭代理缓冲（如果后面有反代）
    # 本镜像直接 serving 静态文件，无需特殊配置

    # SPA 路由：所有非文件请求回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存（确保更新即时生效）
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }
}

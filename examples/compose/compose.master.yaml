# Veilink Master (with optional Embedded Gateway) All-in-One Deployment
services:
  master:
    image: veilink:local # or your registry image
    restart: unless-stopped
    command: [master, -config, /config/master.yaml]
    environment:
      # Automatically initialize administrator account if database is new
      VEILINK_INIT_ADMIN_USERNAME: ${VEILINK_INIT_ADMIN_USERNAME:-admin}
      VEILINK_INIT_ADMIN_PASSWORD: ${VEILINK_INIT_ADMIN_PASSWORD:-ChangeMeToAStrongPassword123!}

      # Enable embedded server (integrated single-machine gateway)
      VEILINK_EMBEDDED_SERVER_ENABLED: ${VEILINK_EMBEDDED_SERVER_ENABLED:-true}
      VEILINK_EMBEDDED_SERVER_NAME: ${VEILINK_EMBEDDED_SERVER_NAME:-integrated-gateway}
      VEILINK_EMBEDDED_SERVER_PORT: ${VEILINK_EMBEDDED_SERVER_PORT:-8444}
      VEILINK_EMBEDDED_SERVER_ADDRESS: ${VEILINK_EMBEDDED_SERVER_ADDRESS:-127.0.0.1}
      VEILINK_EMBEDDED_SERVER_SERVER_NAME: ${VEILINK_EMBEDDED_SERVER_SERVER_NAME:-localhost}
    ports:
      # Web console + gRPC control plane (TLS)
      - "8443:8443"
      # Embedded server data plane transport port
      - "8444:8444"
      # Example exposed intranet service mapped ports (TCP/UDP)
      - "8080:8080"
      - "8080:8080/udp"
    volumes:
      - ./master.yaml:/config/master.yaml:ro
      - ./data:/data
      - ./certs:/certs:ro

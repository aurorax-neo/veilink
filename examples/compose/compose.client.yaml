# Veilink Standalone Client Deployment
services:
  client:
    image: veilink:local
    restart: unless-stopped
    command: [client, -config, /config/client.yaml]
    environment:
      # Master address for TLS gRPC control plane connection
      VEILINK_MASTER_ADDR: ${VEILINK_MASTER_ADDR:-master.example.com:8443}
      VEILINK_CONTROL_SERVER_NAME: ${VEILINK_CONTROL_SERVER_NAME:-master.example.com}

      # Client node credentials
      VEILINK_NODE_ID: ${VEILINK_NODE_ID:-}
      VEILINK_ENROLL_TOKEN: ${VEILINK_ENROLL_TOKEN:-}
    volumes:
      - ./client.yaml:/config/client.yaml:ro
      - ./data:/data
      - ./certs:/certs:ro
    # Client has no exposed host ports; it dials out to Master and forward traffic to local targets.
    # Connect client to the same network as your internal target services:
    # networks:
    #   - internal

# networks:
#   internal:
#     external: true
